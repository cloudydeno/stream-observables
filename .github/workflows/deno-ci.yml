name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}

jobs:

  check:
    runs-on: ubuntu-latest
    name: Check w/ ${{ matrix.deno-version }}
    strategy:
      matrix:
        deno-version:
        - v2.3
        - v2.4
        - v2.5
        - v2.6
        - canary
      fail-fast: false # run each branch to completion

    steps:
    - name: Checkout source
      uses: actions/checkout@v6

    - name: Use Deno ${{ matrix.deno-version }}
      uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ matrix.deno-version }}

    - name: Cache Deno deps
      uses: actions/cache@v5
      with:
        path: ~/.cache/deno
        key: denodir/${{ matrix.deno-version }}-${{ hashFiles('deno.lock') }}

    - name: Check src/mod.ts
      run: time deno cache src/mod.ts

    - name: Check src/example.ts
      run: time deno cache src/example.ts

    - name: Ensure deno.json is clean
      run: hack/update-jsr.ts

    - name: Run test suite
      run: time deno test tests/**/*.ts

    - name: Check publish rules
      run: deno publish --dry-run
      working-directory: src

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    name: Publish to JSR
    needs: check
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v6

    - uses: denoland/setup-deno@v2

    - name: Cache Deno deps
      uses: actions/cache@v5
      with:
        path: ~/.cache/deno
        key: denodir-${{ hashFiles('deno.lock') }}

    - name: Publish now
      run: deno publish
      working-directory: src
